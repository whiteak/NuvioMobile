name: Desktop build

# Builds the desktop (Windows) app: compiles on every push to a desktop work branch,
# and makes a Windows installer when run by hand.

on:
  push:
    branches: ["claude/**", "desktop/**"]
    paths:
      - "composeApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      installer:
        description: Also build the Windows installer
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Empty local.properties (no keys needed to compile)
        run: touch local.properties
      - name: Compile the desktop app
        run: ./gradlew --no-daemon --continue :composeApp:compileKotlinDesktop

  installer:
    if: github.event_name == 'workflow_dispatch' && inputs.installer
    needs: compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Empty local.properties
        shell: bash
        run: touch local.properties
      - name: Download libVLC for the built-in player
        shell: pwsh
        run: |
          $v = "3.0.21"
          Invoke-WebRequest "https://download.videolan.org/pub/videolan/vlc/$v/win64/vlc-$v-win64.zip" -OutFile vlc.zip
          Expand-Archive vlc.zip -DestinationPath vlc-extract
          $src = "vlc-extract/vlc-$v"
          $dst = "composeApp/desktop-resources/windows/vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src/libvlc.dll", "$src/libvlccore.dll" $dst
          Copy-Item -Recurse "$src/plugins" $dst
          # Interface, scripting and visualiser plugins aren't used by an embedded player.
          Remove-Item -Recurse -Force "$dst/plugins/gui", "$dst/plugins/lua", "$dst/plugins/visualization", "$dst/plugins/control" -ErrorAction SilentlyContinue
      - name: Build the Windows installer
        run: ./gradlew --no-daemon :composeApp:packageMsi
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: composeApp/build/compose/binaries/main/msi/*.msi
