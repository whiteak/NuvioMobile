name: Move Requiem updates (one time)

# One time only, and only when Jason asks. Requiem phones installed before the move look for updates in THIS repo's
# releases. This copies the newest Requiem phone APK from whiteak/Requiem (which looks for its updates there) into one
# release here, so installed Requiem phones update once and from then on follow whiteak/Requiem.
# The tag and title are deliberately not version numbers, so Ethereal's updater ignores this release, and it is never
# marked latest. Requiem's updater reads the version from the APK's file name.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo whiteak/Requiem --limit 50 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' | grep '^phone-' | head -n 1)
          [ -n "$tag" ] || { echo "::error::No phone release in whiteak/Requiem yet."; exit 1; }
          gh release download "$tag" --repo whiteak/Requiem -p 'Requiem-Android-*.apk' -D out
          apk=$(ls out/Requiem-Android-*.apk | head -n 1)
          version=$(basename "$apk" .apk); version=${version#Requiem-Android-}
          echo "Moving Requiem phone $version (from whiteak/Requiem $tag)"
          printf 'Requiem for phones %s: from this version on, Requiem looks for its updates at https://github.com/whiteak/Requiem.\n\nThis release is only here so Requiem phones installed earlier update once. Ethereal ignores it.\n' "$version" > notes.md
          gh release create "requiem-moved-$version" "$apk" --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Requiem now updates from its own place" --notes-file notes.md
