name: Build Requiem for Android (on Prism)

# Manual only. Requiem for Android phones is the full Prism phone app (whiteak/prism mobile/) built on the
# NuvioMobile branch Prism uses, named Requiem with Requiem's pictures (editions/requiem/android-on-prism.sh).
# It keeps Requiem's app ID and signing key and is published as Requiem-Android-<version>.apk on a new
# release here, so the Requiem already installed updates to it in the app.
# Ethereal is rebuilt from this branch as it is (no Nuvio sync) and goes on the same release, because the
# Ethereal phone app reads the newest release and would otherwise be offered Requiem's APK.

on:
  workflow_dispatch:
    inputs:
      prism_ref:
        description: whiteak/prism branch or commit to build from
        default: main
      app_ref:
        description: NuvioMobile branch the app is built from (the one Prism uses)
        default: claude/project-thread-lph2qt

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      base: ${{ steps.v.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::The SIGNING_KEYSTORE secret is missing."; exit 1; }
          base=$(sed -n 's/^MARKETING_VERSION=//p' iosApp/Configuration/Version.xcconfig | tr -d '[:space:]')
          base_code=$(sed -n 's/^CURRENT_PROJECT_VERSION=//p' iosApp/Configuration/Version.xcconfig | tr -d '[:space:]')
          tags=$(gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name')
          last=$(printf '%s\n' "$tags" | sed -n "s/^v$(printf '%s' "$base" | sed 's/[.]/\\./g')\\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          echo "version=$base.$n" >> "$GITHUB_OUTPUT"
          echo "code=$(( base_code * 1000 + n ))" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Building $base.$n"
          gh release create "v$base.$n" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Ethereal $base.$n (building)" --notes "Still building."

  ethereal:
    name: Build Ethereal (unchanged)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ethereal
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i "s/^MARKETING_VERSION=.*/MARKETING_VERSION=$VERSION/; s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=$VERSION_CODE/" iosApp/Configuration/Version.xcconfig
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/signing.jks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$KEY_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk "Ethereal-Android-$VERSION.apk"
          for i in 1 2 3 4; do gh release upload "v$VERSION" "Ethereal-Android-$VERSION.apk" --clobber && exit 0; sleep $((i * 5)); done
          exit 1

  requiem:
    name: Build Requiem (Prism inside)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out Requiem's files
        uses: actions/checkout@v4
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref }}
          path: app
      - name: Check out Prism
        uses: actions/checkout@v4
        with:
          repository: whiteak/prism
          ref: ${{ inputs.prism_ref }}
          path: prism
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: app/**/*.gradle*
      - name: Turn the app into Requiem (Prism inside)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          sed -i "s/^MARKETING_VERSION=.*/MARKETING_VERSION=$VERSION/; s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=$VERSION_CODE/" app/iosApp/Configuration/Version.xcconfig
          # Prism's extra app icons are Prism pictures, so Requiem leaves them out (and their files).
          keys=$(cut -d'|' -f1 prism/mobile/icons.txt)
          : > prism/mobile/icons.txt
          bash prism/mobile/apply.sh "$PWD/app"
          for k in $keys; do
            find app/composeApp/src/androidMain/res app/composeApp/src/commonMain/composeResources/drawable -type f \
              \( -name "ic_launcher_${k}.*" -o -name "ic_launcher_${k}_foreground.*" -o -name "ic_splash_logo_${k}.*" -o -name "app_icon_${k}.*" \) -delete
          done
          bash editions/requiem/android-on-prism.sh "$PWD/app"
      - name: Build
        working-directory: app
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          KEY_ALIAS: ethereal
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/signing.jks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$KEY_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID"
            echo "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET"
            echo "TRAKT_REDIRECT_URI=https://whiteak.github.io/Trakt-return/"
          } > local.properties
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace
          cp androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk "Requiem-Android-$VERSION.apk"
          for i in 1 2 3 4; do gh release upload "v$VERSION" "Requiem-Android-$VERSION.apk" --repo "$GITHUB_REPOSITORY" --clobber && exit 0; sleep $((i * 5)); done
          exit 1

  publish:
    name: Publish release
    needs: [version, ethereal, requiem]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          BASE: ${{ needs.version.outputs.base }}
        run: |
          {
            printf 'Ethereal %s, built on Nuvio %s.\n\n' "$VERSION" "$BASE"
            printf -- '- Requiem-Android-%s.apk: Requiem, now with everything from Prism (Customise in Settings > Appearance).\n' "$VERSION"
            printf -- '- Ethereal-Android-%s.apk: Ethereal, unchanged.\n\n' "$VERSION"
            printf 'Built from commit %s\n' "$GITHUB_SHA"
          } > notes.md
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --title "Ethereal $VERSION" --notes-file notes.md
          # Keep only the newest 2 releases (tags stay, so numbering never goes backwards).
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt,isDraft --jq '[.[] | select(.isDraft | not)] | sort_by(.createdAt) | reverse | .[].tagName' |
            grep '^v' | tail -n +3 | while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes || true; done

  tidy:
    name: Remove the draft if a build failed
    needs: [version, ethereal, requiem, publish]
    if: failure() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
